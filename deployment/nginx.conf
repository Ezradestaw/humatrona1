# Nginx Configuration for Humatron (humatron.me)
# Place in /etc/nginx/sites-available/humatron and symlink to /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=humatron_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=humatron_auth:10m rate=5r/m;

# HTTP -> HTTPS redirection
server {
    listen 80;
    listen [::]:80;
    server_name humatron.me www.humatron.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://humatron.me$request_uri;
    }
}

# Canonical HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.humatron.me;

    ssl_certificate /etc/letsencrypt/live/humatron.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humatron.me/privkey.pem;

    return 301 https://humatron.me$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name humatron.me;

    # SSL TLS Configuration
    ssl_certificate /etc/letsencrypt/live/humatron.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humatron.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (matches MAX_UPLOAD_SIZE_MB)
    client_max_body_size 60M;
    client_body_timeout 120s;

    # Static Files
    location /static/ {
        alias /var/www/humatron/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Protected Media Files: Deny direct external HTTP access
    # Downloads must strictly pass through authenticated Django view (/pdf/jobs/<id>/download/)
    location /media/ {
        internal;
        alias /var/www/humatron/media/;
    }

    # Sensitive auth endpoints with dedicated rate limit
    location /accounts/login/ {
        limit_req zone=humatron_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General App Proxying
    location / {
        limit_req zone=humatron_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}
