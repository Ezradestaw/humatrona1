{% extends "base.html" %}

{% block title %}Reset Password — Humatron{% endblock %}

{% block content %}
<div class="panel" style="max-width: 480px; margin: 0 auto;">
  <h1>Reset Password</h1>
  <p>Enter your account email address. We will send a secure single-use link to reset your password.</p>

  <form method="post" action="{% url 'accounts:password_reset' %}" style="margin-top: 20px;">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="id_email">Email Address</label>
      <input type="email" name="email" id="id_email" class="form-input" required autocomplete="email" placeholder="name@example.com">
    </div>

    <button type="submit" class="btn btn-primary btn-block">
      Send Reset Link
    </button>
  </form>

  <div style="margin-top: 20px; text-align: center; font-size: 14px;">
    <a href="{% url 'accounts:login' %}">Return to Sign In</a>
  </div>
</div>
{% endblock %}
