{% extends "base.html" %}

{% block title %}Password Reset Successful — Humatron{% endblock %}

{% block content %}
<div class="panel" style="max-width: 520px; margin: 0 auto; text-align: center; padding: 40px 24px;">
  <div class="badge badge-completed" style="font-size: 14px; padding: 6px 14px; margin-bottom: 16px;">Success</div>
  <h1>Password Updated</h1>
  <p>Your account password has been changed successfully. You may now sign in with your new credentials.</p>
  <div style="margin-top: 24px;">
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign In</a>
  </div>
</div>
{% endblock %}
