<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Humatron{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 32px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .header {
      background-color: #0f172a;
      padding: 24px 32px;
      text-align: left;
    }
    .brand {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .brand-sub {
      color: #94a3b8;
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }
    .body {
      padding: 32px;
    }
    h1, h2, h3 {
      color: #0f172a;
      margin-top: 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #0f172a;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 0;
    }
    .callout {
      background-color: #f1f5f9;
      border-left: 4px solid #0f172a;
      padding: 12px 16px;
      margin: 16px 0;
      font-size: 14px;
    }
    .footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 20px 32px;
      font-size: 12px;
      color: #64748b;
      text-align: left;
    }
    .footer a {
      color: #64748b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <span class="brand">HUMATRON</span>
        <span class="brand-sub">Document Processing SaaS &bull; humatron.me</span>
      </div>
      <div class="body">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p style="margin: 0 0 6px 0;"><strong>Humatron</strong> — Formal, secure PDF image conversion service.</p>
        <p style="margin: 0;">Processed documents are automatically retained for 7 days before permanent removal. For assistance, contact support@humatron.me.</p>
      </div>
    </div>
  </div>
</body>
</html>
